# REQ-0322 — docs/adr/0030-volume-listing-without-stat.md §Decision
# Authored from the measured hung WebDAV mount in /Volumes; the parse, canonical form and address are derived at load.
schema: req.claim/2
claim_id: REQ-0322
statement: "The removable-volume probe shall report a timeout when /Volumes does not list within its hard bound."
applicability: []
relations: []
rationale:
  source: docs/adr/0030-volume-listing-without-stat.md#decision
  date: 2026-11-09
  rejected_alternatives:
    - "Waiting for the listing: a kernel call stuck on a hung mount has no deadline of its own."
    - "Treating a timeout as PASS or as an empty list: an absent signal is never a measurement."
  assumptions:
    - "The check process is short-lived, so abandoning the blocked worker is acceptable."
pins:
  modality: "SHALL"
tests:
  - "DiskTriageCollectorsTests.VolumeListingTests::REQ0322_blockedListingTimesOutWithoutPassing()"
