# REQ-0321 — docs/adr/0029-volume-listing-without-stat.md §Decision
# Authored from the measured hung WebDAV mount in /Volumes; the parse, canonical form and address are derived at load.
schema: req.claim/2
claim_id: REQ-0321
statement: "The removable-volume probe shall list /Volumes entry names without resolving each entry's attributes."
applicability: []
relations: []
rationale:
  source: docs/adr/0029-volume-listing-without-stat.md#decision
  date: 2026-11-09
  rejected_alternatives:
    - "FileManager.contentsOfDirectory: it resolves entry metadata and blocked for 160-260 s beside a hung WebDAV mount."
    - "readdir followed by a stat per entry: the stat is the call that never returns on the hung mount."
  assumptions:
    - "opendir/readdir on /Volumes returns names without touching the mounted filesystem, as measured with ls -f."
pins:
  modality: "SHALL"
tests:
  - "DiskTriageCollectorsTests.VolumeListingTests::REQ0321_listsEntryNamesWithoutResolvingThem()"
  - "DiskTriageCollectorsTests.VolumeListingTests::REQ0321_unreadableDirectoryIsNotAnEmptyList()"
